[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/tui"]

[workspace.package]
version = "1.0.2"
edition = "2021"
license = "AGPL-3.0-only"

# 发布构建:体积/速度最优化
[profile.release]
opt-level = "z"          # 以体积最小为目标
lto = true               # 全程序链接优化
codegen-units = 1
panic = "abort"
strip = "symbols"        # 剥离符号表

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "fs", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures-util = "0.3"
async-stream = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
ratatui = "0.29"
crossterm = "0.28"
regex = "1"
